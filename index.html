<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ツール置き場</title>
    <style>
        body {
            font-family: "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
            background-color: #fdfdfd;
        }
        h1 {
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            margin: 10px 0;
        }
        a.tool-link {
            text-decoration: none;
            color: #3498db;
            font-weight: bold;
            display: block;
            padding: 10px;
            border: 1px solid #eee;
            border-radius: 5px;
            background: #fff;
            transition: 0.2s;
        }
        a.tool-link:hover {
            background: #f0f7ff;
            border-color: #3498db;
        }

        /* --- カウンター専用スタイル（サイズ微増・欠け対策） --- */
        .counter-container {
            margin: 20px 0;
            text-align: center;
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }
        .counter-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        #counter-area {
            margin: 0 10px;
            padding: 6px 12px; 
            background: #000;
            border: 2px inset #ccc;
            display: inline-block;
            line-height: 0;
            overflow: visible; 
            width: auto;
        }
        .counter-digits {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0;
        }
        .counter-digits img {
            /* 画像サイズを少し大きく（28px → 32px） */
            height: 32px; 
            width: auto;
            display: block;
            margin: 0;
            image-rendering: pixelated;
        }
        .kiriban-note {
            font-size: 11px;
            color: #666;
        }
        .kiriban-note a { color: #1da1f2; text-decoration: underline; }
        #admin-badge { font-size: 10px; color: red; display: none; margin-top: 5px; }
    </style>
</head>
<body>

    <h1>ツール置き場</h1>
    <p>AIくんと作ったまあまあ便利なWebツールを公開しています。</p>

    <div class="counter-container">
        <div class="counter-wrapper">
            ツール利用数：
            <div id="counter-area">
                <div id="counter-display" class="counter-digits"></div>
            </div>
            回！
        </div>
        <div id="admin-badge">●管理者モード（カウント除外中）</div>
        <div class="kiriban-note">
            キリ番報告は <a id="twitter-share" href="#" target="_blank" rel="noopener">Twitter</a> へ！
        </div>
    </div>

    <ul>
        <li><a href="bbtouka.html" class="tool-link">BB＆GB 背景透過ツール</a></li>
        <li><a href="dakuten.html" class="tool-link">キモオタ濁点ジェネレーター</a></li>
    </ul>

    <hr style="border: 0; border-top: 1px solid #eee; margin: 40px 0 20px;">

    <script>
        async function loadCounter() {
            const displayArea = document.getElementById('counter-display');
            const twitterLink = document.getElementById('twitter-share');
            const adminBadge = document.getElementById('admin-badge');
            const WORKER_URL = 'https://dry-silence-4f1f.y-bb0.workers.dev';
            const IMAGE_PATH = 'akusesu_kaunta_moji_sozai/'; 
            const SITE_URL = window.location.href;
            
            const pageId = "tool_page";
            const isAdmin = localStorage.getItem('is_admin_yukidama') === 'true';

            try {
                let fetchUrl = `${WORKER_URL}?id=${pageId}`;
                if (isAdmin) fetchUrl += "&no-count=1";

                const response = await fetch(fetchUrl);
                const data = await response.json();
                const countStr = String(data.count).padStart(6, '0');

                if (isAdmin) adminBadge.style.display = 'block';

                const tweetText = `ゆきだまの「ツール置き場」でキリ番（${countStr}）を踏んだよ！\n${SITE_URL}\n\n@yukidama_yoshi`;
                twitterLink.href = `https://twitter.com/intent/tweet?text=${encodeURIComponent(tweetText)}`;

                displayArea.innerHTML = ''; 
                for (let char of countStr) {
                    const img = document.createElement('img');
                    img.src = `${IMAGE_PATH}${char}.png`;
                    img.alt = char;
                    displayArea.appendChild(img);
                }
            } catch (err) {
                displayArea.innerHTML = '<span style="color:#f00; font-size:10px;">ERR</span>';
            }
        }
        loadCounter();
    </script>

</body>
</html>
