<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ツール置き場</title>
    <style>
        body {
            font-family: "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
            background-color: #fdfdfd;
        }
        h1 {
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            margin: 10px 0;
        }
        a.tool-link {
            text-decoration: none;
            color: #3498db;
            font-weight: bold;
            display: block;
            padding: 10px;
            border: 1px solid #eee;
            border-radius: 5px;
            background: #fff;
            transition: 0.2s;
        }
        a.tool-link:hover {
            background: #f0f7ff;
            border-color: #3498db;
        }

        /* --- カウンター専用スタイル --- */
        .counter-container {
            margin: 20px 0;
            text-align: center;
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }
        .counter-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            color: #555;
            margin-bottom: 5px;
        }
        #counter-area {
            margin: 0 6px;
            display: inline-block;
        }
        .counter-digits {
            color: #3498db; /* サイトのテーマカラー（青）に合わせました */
            font-family: "Helvetica Neue", Arial, sans-serif;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }
        .kiriban-note {
            font-size: 11px;
            color: #666;
        }
        .kiriban-note a { color: #1da1f2; text-decoration: underline; }
        #admin-badge { font-size: 10px; color: red; display: none; margin-top: 5px; }
    </style>
</head>
<body>

    <h1>ツール置き場</h1>
    <p>AIくんと作ったまあまあ便利なWebツールを公開しています。</p>

    <div class="counter-container">
        <div class="counter-wrapper">
            ツール利用数：
            <div id="counter-area">
                <span id="counter-display" class="counter-digits">000000</span>
            </div>
            回
        </div>
        <div id="admin-badge">●管理者モード（カウント除外中）</div>
        <div class="kiriban-note">
            キリ番報告は <a id="twitter-share" href="#" target="_blank" rel="noopener">Twitter</a> へ！
        </div>
    </div>

    <ul>
        <li><a href="bbtouka.html" class="tool-link">BB＆GB 背景透過ツール</a></li>
        <li><a href="dakuten.html" class="tool-link">D゛a゛k゛u゛t゛e゛n゛</a></li>
        <li><a href="dentaku.html" class="tool-link">ブラウザ電卓（ベータ版）</a></li>
        <li><a href="altushuku.html" class="tool-link">画像圧縮ツール（ベータ版）</a></li>
    </ul>

    <hr style="border: 0; border-top: 1px solid #eee; margin: 40px 0 20px;">

    <script>
        async function loadCounter() {
            const displayArea = document.getElementById('counter-display');
            const twitterLink = document.getElementById('twitter-share');
            const adminBadge = document.getElementById('admin-badge');
            const WORKER_URL = 'https://dry-silence-4f1f.y-bb0.workers.dev';
            const SITE_URL = window.location.href;
            
            // ツールページ用の個別ID
            const pageId = "tool_page";

            // 1. 管理者判定（A館での設定を引き継ぐ）
            const isAdmin = localStorage.getItem('is_admin_yukidama') === 'true';

            // 2. 二重カウント防止チェック（同じタブで開いている間は1回だけ）
            const hasCounted = sessionStorage.getItem('has_counted_' + pageId) === 'true';

            try {
                let fetchUrl = `${WORKER_URL}?id=${pageId}`;

                // 管理者、またはこのタブで既にカウント済みの場合は no-count=1 を付与
                if (isAdmin || hasCounted) {
                    fetchUrl += "&no-count=1";
                }

                const response = await fetch(fetchUrl);
                const data = await response.json();
                const countStr = String(data.count).padStart(6, '0');

                // 3. カウントに成功し、かつ管理者でない場合のみフラグを立てる
                if (!isAdmin && !hasCounted) {
                    sessionStorage.setItem('has_counted_' + pageId, 'true');
                }

                if (isAdmin) adminBadge.style.display = 'block';

                // ツイート内容
                const tweetText = `ゆきだまの「ツール置き場」でキリ番（${countStr}）を踏んだよ！\n${SITE_URL}\n\n@yukidama_yoshi`;
                twitterLink.href = `https://twitter.com/intent/tweet?text=${encodeURIComponent(tweetText)}`;

                // テキストとして代入
                displayArea.textContent = countStr;

            } catch (err) {
                displayArea.innerHTML = '<span style="color:#f00; font-size:10px;">ERR</span>';
            }
        }
        loadCounter();
    </script>

</body>
</html>
