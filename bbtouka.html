<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BB&GB 背景透過ツール</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; background-color: #f8f9fa; color: #333; }
        
        .nav-header { margin-bottom: 20px; }
        .btn-back { text-decoration: none; font-size: 14px; color: #666; display: inline-flex; align-items: center; }
        .btn-back:hover { color: #000; }

        h1 { margin-top: 0; font-size: 1.5rem; }
        p { font-size: 0.9rem; color: #666; }

        .upload-section { 
            background: white; border: 1px solid #ddd; border-radius: 8px; 
            padding: 20px; text-align: center; margin-bottom: 10px; 
        }
        
        .button-group { display: flex; gap: 10px; margin-bottom: 15px; }
        button { flex: 1; padding: 14px; cursor: pointer; border: none; border-radius: 6px; font-weight: bold; font-size: 16px; transition: 0.2s; }
        
        .btn-primary { background: #333; color: #fff; }
        .btn-primary:hover { background: #000; }

        /* 保存・コピーボタンエリア */
        .action-group { display: flex; gap: 10px; margin-top: 15px; }
        .btn-download { background: #007bff; color: #fff; }
        .btn-download:hover { background: #0056b3; }
        .btn-copy { background: #28a745; color: #fff; }
        .btn-copy:hover { background: #218838; }
        .btn-download:disabled, .btn-copy:disabled { background: #ccc; cursor: not-allowed; }

        .controls { background: white; border: 1px solid #eee; border-radius: 8px; padding: 15px; margin-bottom: 20px; }
        .mode-switch { display: flex; gap: 10px; margin-bottom: 15px; }
        .mode-option { flex: 1; display: flex; align-items: center; justify-content: center; gap: 5px; font-size: 0.9rem; font-weight: bold; }
        
        .slider-box { border-top: 1px solid #eee; pt: 15px; margin-top: 10px; padding-top: 10px; }
        .slider-box label { display: block; font-size: 0.8rem; margin-bottom: 5px; }
        .slider-desc { font-size: 0.75rem; color: #888; margin-top: 5px; line-height: 1.4; }
        input[type="range"] { width: 100%; cursor: pointer; }

        .result-area { 
            margin-top: 20px; padding: 10px; background: white; border: 1px solid #eee; border-radius: 8px; 
            min-height: 200px; display: flex; align-items: center; justify-content: center;
            background-image: linear-gradient(45deg, #f0f0f0 25%, transparent 25%, transparent 75%, #f0f0f0 75%, #f0f0f0), 
                              linear-gradient(45deg, #f0f0f0 25%, transparent 25%, transparent 75%, #f0f0f0 75%, #f0f0f0);
            background-size: 20px 20px; background-position: 0 0, 10px 10px;
        }
        canvas { max-width: 100%; height: auto; border-radius: 4px; }
        
        .status-msg { font-size: 0.8em; color: #666; margin-top: 10px; text-align: center; }
    </style>
</head>
<body>

    <nav class="nav-header">
        <a href="./" class="btn-back">← トップへ戻る</a>
    </nav>

    <h1>BB&GB 背景透過ツール</h1>
    <p>写真を選んで、青背景（BB）や緑背景（GB）を透過します。</p>

    <div class="upload-section">
        <div class="button-group">
            <button class="btn-primary" onclick="document.getElementById('upload').click()">画像を選ぶ</button>
            <button class="btn-primary" id="pasteBtn">クリップボードから貼り付け</button>
        </div>
        <input type="file" id="upload" accept="image/*" style="display:none">
    </div>

    <div class="controls">
        <div class="mode-switch">
            <div class="mode-option">
                <input type="radio" name="mode" id="mode-blue" value="blue" checked onchange="processImage()">
                <label for="mode-blue">BB (Blue)</label>
            </div>
            <div class="mode-option">
                <input type="radio" name="mode" id="mode-green" value="green" onchange="processImage()">
                <label for="mode-green">GB (Green)</label>
            </div>
        </div>
        <div class="slider-box">
            <label>色の消し具合: <span id="thresholdVal">100</span></label>
            <input type="range" id="threshold" min="0" max="200" value="100" oninput="updateThreshold(this.value)">
            <div class="slider-desc">
                値が0に近いほど厳密になります            </div>
        </div>
    </div>
    
    <div id="status" class="status-msg">画像を読み込んでください</div>

    <div class="result-area">
        <canvas id="canvas"></canvas>
    </div>

    <div class="action-group">
        <button id="download" class="btn-download" disabled onclick="downloadImage()">名前をつけて保存</button>
        <button id="copyBtn" class="btn-copy" disabled onclick="copyToClipboard()">クリップボードにコピー</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const thresholdVal = document.getElementById('thresholdVal');
        const downloadBtn = document.getElementById('download');
        const copyBtn = document.getElementById('copyBtn');
        const statusText = document.getElementById('status');

        let originalImage = null;
        let originalImageData = null; 
        let currentFileName = "背景透過画像";

        function updateThreshold(val) {
            thresholdVal.innerText = val;
            processImage();
        }

        function handleImage(file) {
            if (!file || !file.type.startsWith('image/')) return;
            if (file.name) currentFileName = file.name.replace(/\.[^/.]+$/, "");

            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    originalImage = img;
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);
                    originalImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    statusText.textContent = `サイズ: ${img.width} × ${img.height}`;
                    processImage();
                    downloadBtn.disabled = false;
                    copyBtn.disabled = false;
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function processImage() {
            if (!originalImageData) return;
            const mode = document.querySelector('input[name="mode"]:checked').value;
            const threshold = parseInt(document.getElementById('threshold').value);

            const workingData = new ImageData(new Uint8ClampedArray(originalImageData.data), originalImageData.width, originalImageData.height);
            const data = workingData.data;

            for (let i = 0; i < data.length; i += 4) {
                const r = data[i], g = data[i + 1], b = data[i + 2];
                let remove = (mode === 'blue') ? (b > r + threshold && b > g + threshold) : (g > r + threshold && g > b + threshold);
                if (remove) data[i + 3] = 0;
            }
            ctx.putImageData(workingData, 0, 0);
        }

        document.getElementById('upload').addEventListener('change', (e) => handleImage(e.target.files[0]));
        
        document.getElementById('pasteBtn').addEventListener('click', async () => {
            try {
                const items = await navigator.clipboard.read();
                for (const item of items) {
                    const types = item.types.filter(t => t.startsWith('image/'));
                    if (types.length > 0) {
                        const blob = await item.getType(types[0]);
                        handleImage(blob);
                        return;
                    }
                }
            } catch (err) { alert("貼り付け権限が必要です"); }
        });

        function downloadImage() {
            let fileName = prompt("保存するファイル名を入力", currentFileName);
            if (!fileName) return;
            const link = document.createElement('a');
            link.download = fileName.endsWith(".png") ? fileName : fileName + ".png";
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        async function copyToClipboard() {
            try {
                canvas.toBlob(async (blob) => {
                    const item = new ClipboardItem({ "image/png": blob });
                    await navigator.clipboard.write([item]);
                    alert("クリップボードにコピーしました");
                });
            } catch (err) {
                alert("コピーに失敗しました。ブラウザの制限がある可能性があります。");
            }
        }
    </script>
</body>
</html>
